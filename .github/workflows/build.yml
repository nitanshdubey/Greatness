name: Build Greatness APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download adult blocklist
        run: |
          mkdir -p app/src/main/assets
          curl -L https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts \
            | grep '^0.0.0.0' | awk '{print $2}' > app/src/main/assets/blocklist.txt
          wc -l app/src/main/assets/blocklist.txt

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Greatness-apk
          path: app/build/outputs/apk/debug/app-debug.apk
